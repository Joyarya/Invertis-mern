<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Planly project manager dashboard built with CSS Grid">
    <meta name="author" content="Jwaydeep Sagar">
    <title>Planly | Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="dashboard">
        <header class="topbar">
            <a class="topbar__brand" href="index.html">Planly<span>.</span></a>
            <div class="topbar__user">
                <span class="topbar__avatar">JS</span>
                <span>Jwaydeep Sagar</span>
            </div>
        </header>

        <aside class="sidebar">
            <nav aria-label="Main">
                <ul class="sidebar__list">
                    <li><a class="sidebar__link sidebar__link--active" href="#" aria-current="page">Dashboard</a></li>
                    <li><a class="sidebar__link" href="#">Projects</a></li>
                    <li><a class="sidebar__link" href="#">Tasks</a></li>
                    <li><a class="sidebar__link" href="#">Team</a></li>
                    <li><a class="sidebar__link" href="#">Settings</a></li>
                </ul>
            </nav>
        </aside>

        <main class="main">
            <h1 class="main__title">Overview</h1>
            <p class="main__subtitle">Here is what is happening across your projects today.</p>

            <section class="stats">
                <article class="stat">
                    <p class="stat__label">Active projects</p>
                    <p class="stat__value">12</p>
                </article>
                <article class="stat">
                    <p class="stat__label">Tasks due</p>
                    <p class="stat__value">27</p>
                </article>
                <article class="stat">
                    <p class="stat__label">Team members</p>
                    <p class="stat__value">8</p>
                </article>
                <article class="stat">
                    <p class="stat__label">Completed</p>
                    <p class="stat__value">94%</p>
                </article>
            </section>
        </main>

        <footer class="footer">
            <p>&copy; 2026 Planly</p>
            <p>Built with CSS Grid</p>
        </footer>
    </div>
</body>
</html>
