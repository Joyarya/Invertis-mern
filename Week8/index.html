<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Planly project manager dashboard built with CSS Grid">
    <meta name="author" content="Jwaydeep Sagar">
    <title>Planly | Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="dashboard">
        <header class="topbar">
            <a class="topbar__brand" href="index.html">Planly<span>.</span></a>
            <div class="topbar__user">
                <span class="topbar__avatar">JS</span>
                <span>Jwaydeep Sagar</span>
            </div>
        </header>

        <aside class="sidebar">
            <nav aria-label="Main">
                <ul class="sidebar__list">
                    <li><a class="sidebar__link sidebar__link--active" href="#" aria-current="page">Dashboard</a></li>
                    <li><a class="sidebar__link" href="#">Projects</a></li>
                    <li><a class="sidebar__link" href="#">Tasks</a></li>
                    <li><a class="sidebar__link" href="#">Team</a></li>
                    <li><a class="sidebar__link" href="#">Settings</a></li>
                </ul>
            </nav>
        </aside>

        <main class="main">
            <h1 class="main__title">Overview</h1>
            <p class="main__subtitle">Here is what is happening across your projects today.</p>

                        <section class="stats">
                <article class="stat">
                    <span class="stat__icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/>
                        </svg>
                    </span>
                    <div class="stat__info">
                        <p class="stat__label">Active projects</p>
                        <p class="stat__value">12</p>
                    </div>
                </article>

                <article class="stat">
                    <span class="stat__icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <circle cx="12" cy="12" r="9"/>
                            <path d="M12 7v5l3 2"/>
                        </svg>
                    </span>
                    <div class="stat__info">
                        <p class="stat__label">Tasks due</p>
                        <p class="stat__value">27</p>
                    </div>
                </article>

                <article class="stat">
                    <span class="stat__icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <circle cx="9" cy="8" r="3.5"/>
                            <path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/>
                            <path d="M16 4.6a3.5 3.5 0 0 1 0 6.8"/>
                            <path d="M18 14.3c2 .8 3.5 2.7 3.5 5.7"/>
                        </svg>
                    </span>
                    <div class="stat__info">
                        <p class="stat__label">Team members</p>
                        <p class="stat__value">8</p>
                    </div>
                </article>

                <article class="stat">
                    <span class="stat__icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <circle cx="12" cy="12" r="9"/>
                            <path d="M8 12.5l2.7 2.7L16 9.5"/>
                        </svg>
                    </span>
                    <div class="stat__info">
                        <p class="stat__label">Completed</p>
                        <p class="stat__value">94%</p>
                    </div>
                </article>
            </section>
        </main>

        <footer class="footer">
            <p>&copy; 2026 Planly</p>
            <p>Built with CSS Grid</p>
        </footer>
    </div>
</body>
</html>
